<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="shortcut icon" href="assets/icons/favicon.ico" />
        <link rel="stylesheet" href="css/main.css" />
        <link rel="stylesheet" href="css/components/footer.css" />
        <link rel="stylesheet" href="css/components/topbar.css" />

        <title>Lume | Home</title>
    </head>
    <body>
        <main class="landing">
            <header class="topbar"></header>

            <div class="l-center">
                <div class="banner"></div>

                <div class="l-container">
                    <section class="l-section">
                        <header>
                            <h2 class="section-title">
                                Favoritos dos pequenos leitores
                            </h2>
                            <p class="section-subtitle">
                                Descubra por que esses livros fazem tanto
                                sucesso!
                            </p>
                        </header>

                        <div class="book-list"></div>
                    </section>
                </div>

                <footer class="footer-main">
                    <div class="footer-main__wrapper">
                        <div class="footer-main__left">
                            <p class="footer-main__text">
                                <strong>Fale conosco</strong>
                            </p>
                            <a
                                href="#"
                                class="footer-main__text footer-main__link"
                            >
                                <img
                                    src="assets/icons/email.svg"
                                    alt=""
                                    width="24"
                                    height="24"
                                />
                                www.contato@lume.com
                            </a>
                        </div>

                        <div class="footer-main__right">
                            <img
                                src="assets/images/logo-lume.svg"
                                alt="Lume"
                                class="footer-main__logo"
                            />
                        </div>
                    </div>
                </footer>
            </div>
        </main>

        <script type="module" src="js/main.js"></script>
    </body>
</html>
