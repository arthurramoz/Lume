<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="shortcut icon" href="/assets/icons/favicon.ico" />

        <link rel="stylesheet" href="/css/main.css" />
        <link rel="stylesheet" href="/css/pages/admin-orders.css" />
        <link rel="stylesheet" href="/css/components/navbar.css" />
        <link rel="stylesheet" href="/css/components/table.css" />
        <link rel="stylesheet" href="/css/components/pagination.css" />
        <link rel="stylesheet" href="/css/components/button.css" />
        <link rel="stylesheet" href="/css/components/inputs.css" />

        <title>Lume | Cupons (Admin)</title>
    </head>
    <body>
        <main class="container">
            <div class="navbar"></div>

            <div class="list">
                <header class="list-header">
                    <div class="list-header__info">
                        <h1 class="list-title">Cupons</h1>
                        <p class="list-subtitle">
                            Visualize e gerencie os cupons do sistema
                        </p>
                    </div>
                    <div class="list-actions" style="display:flex;gap:12px;">
                        <div class="select-filter-wrapper">
                            <select id="type-filter">
                                <option value="">Todos tipos</option>
                                <option value="promocional">Promocional</option>
                                <option value="troca">Troca</option>
                            </select>
                        </div>
                        <div
                            class="select-filter-wrapper"
                            id="status-filter-wrapper"
                        >
                            <select id="status-filter">
                                <option value="">Todos status</option>
                                <option value="ativo">Ativo</option>
                                <option value="inativo">Inativo</option>
                            </select>
                            <span class="filter-icon">
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="18"
                                    height="18"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <line x1="4" y1="21" x2="4" y2="14"></line>
                                    <line x1="4" y1="10" x2="4" y2="3"></line>
                                    <line
                                        x1="12"
                                        y1="21"
                                        x2="12"
                                        y2="12"
                                    ></line>
                                    <line x1="12" y1="8" x2="12" y2="3"></line>
                                    <line
                                        x1="20"
                                        y1="21"
                                        x2="20"
                                        y2="16"
                                    ></line>
                                    <line x1="20" y1="12" x2="20" y2="3"></line>
                                    <line x1="1" y1="14" x2="7" y2="14"></line>
                                    <line x1="9" y1="8" x2="15" y2="8"></line>
                                    <line
                                        x1="17"
                                        y1="16"
                                        x2="23"
                                        y2="16"
                                    ></line>
                                </svg>
                            </span>
                        </div>
                    </div>
                </header>

                <div class="table-container">
                    <div class="table-header admin-coupons-table">
                        <span>ID</span>
                        <span>Código</span>
                        <span>Tipo</span>
                        <span>Valor</span>
                        <span>Status</span>
                        <span>Validade</span>
                        <span>Usuário</span>
                        <span>Ações</span>
                    </div>

                    <div id="coupons-table-body"></div>
                </div>

                <footer class="pagination">
                    <span class="pagination-info" id="pagination-info"
                        >Mostrando 1 de 1</span
                    >
                    <div class="pagination-controls" id="pagination-controls">
                        <button class="icon-btn" id="prev-page">
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="18"
                                height="18"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2.5"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <polyline points="15 18 9 12 15 6"></polyline>
                            </svg>
                        </button>
                        <div class="page-numbers" id="page-numbers">
                            <button class="page-number active">1</button>
                        </div>
                        <button class="icon-btn" id="next-page">
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="18"
                                height="18"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2.5"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                        </button>
                    </div>
                </footer>
            </div>
        </main>

        <script type="module" src="/js/main.js"></script>
        <script type="module" src="/js/modules/adminCouponList.js"></script>
    </body>
</html>
