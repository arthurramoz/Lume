<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/assets/icons/favicon.ico" />

    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/pages/users.css" />
    <link rel="stylesheet" href="/css/components/navbar.css" />
    <link rel="stylesheet" href="/css/components/table.css" />
    <link rel="stylesheet" href="/css/components/pagination.css" />
    <link rel="stylesheet" href="/css/components/button.css" />

    <title>Lume | Usuários</title>
  </head>
  <body>
    <main class="container">
      <div class="navbar"></div>

      <div class="list">
        <header class="list-header">
          <h1 class="list-title">Usuários</h1>
          <div class="list-actions">
            <div class="search-input-wrapper">
              <img src="/assets/icons/search.svg" alt="" />
              <input type="text" placeholder="Pesquise por nome" />
            </div>
            <button class="btn-primary">
              <img src="/assets/icons/users-plus.svg" alt="+" width="16" />
              Adicionar
            </button>
          </div>
        </header>

        <div class="table-container">
          <div class="table-header users-table">
            <span>Código</span>
            <span>Nome</span>
            <span>E-mail</span>
            <span>Telefone</span>
            <span>Status</span>
            <span>Ações</span>
          </div>

          <div class="table-body"></div>
        </div>

        <footer class="pagination">
          <span class="pagination-info">Mostrando 1 de 1</span>
          <div class="pagination-controls">
            <button class="icon-btn">
              <img
                src="/assets/icons/users-pagination-left.svg"
                alt="Anterior"
              />
            </button>
            <button class="page-number active">1</button>
            <button class="icon-btn">
              <img
                src="/assets/icons/users-pagination-right.svg"
                alt="Próximo"
              />
            </button>
          </div>
        </footer>
      </div>
    </main>

    <script type="module" src="/js/main.js"></script>
    <script type="module">
      const btnAdicionar = document.querySelector(".btn-primary");

      if (btnAdicionar) {
        btnAdicionar.addEventListener("click", () => {
          window.location.href = "/pages/admin/users/create/index.html";
        });
      }

      const tableBody = document.querySelector(".table-body");
      if (tableBody) {
        tableBody.addEventListener("click", async (e) => {
          const viewBtn = e.target.closest('button[aria-label="Visualizar"]');
          if (viewBtn) {
            const row = viewBtn.closest(".table-row");
            if (row) {
              let idText = row.querySelector(".col-code").textContent.trim();
              if (idText.startsWith("#")) {
                idText = idText.substring(1);
              }
              window.location.href = `/pages/admin/users/view/index.html?id=${encodeURIComponent(idText)}`;
            }
          }

          const editBtn = e.target.closest('button[aria-label="Editar"]');
          if (editBtn) {
            const row = editBtn.closest(".table-row");
            if (row) {
              let idText = row.querySelector(".col-code").textContent.trim();
              if (idText.startsWith("#")) {
                idText = idText.substring(1);
              }
              window.location.href = `/pages/admin/users/edit/index.html?id=${encodeURIComponent(idText)}`;
            }
          }

          const deleteBtn = e.target.closest('button[aria-label="Deletar"]');
          if (deleteBtn) {
            const row = deleteBtn.closest(".table-row");
            if (row) {
              let idText = row.querySelector(".col-code").textContent.trim();
              if (idText.startsWith("#")) {
                idText = idText.substring(1);
              }
              
              if (confirm("Tem certeza que deseja deletar este usuário?")) {
                try {
                  const res = await fetch(`http://localhost:3333/api/users/${idText}`, {
                    method: "DELETE"
                  });
                  if (res.ok) {
                    alert("Usuário deletado com sucesso!");
                    window.location.reload();
                  } else {
                    const errorData = await res.json();
                    alert("Erro ao deletar usuário: " + (errorData.error || ""));
                  }
                } catch (error) {
                  console.error(error);
                  alert("Erro de conexão ao deletar usuário.");
                }
              }
            }
          }
        });
      }
    </script>
  </body>
</html>
