<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/assets/icons/favicon.ico" />

    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/pages/users.css" />
    <link rel="stylesheet" href="/css/components/navbar.css" />
    <link rel="stylesheet" href="/css/components/button.css" />

    <title>Lume | Editar Usuário</title>
  </head>
  <body>
    <main class="container">
      <div class="navbar"></div>

      <div class="list">
        <a href="/pages/admin/users/index.html" class="back-link">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            viewBox="0 0 16 16"
          >
            <path
              fill-rule="evenodd"
              d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"
            />
          </svg>
          Voltar
        </a>

        <div class="create-header">
          <h1 class="section-title">Editar usuário</h1>
          <p class="section-subtitle">Edite os dados do usuário</p>
        </div>

        <form id="edit-user-form" class="user-form">
          <div class="user-form-grid">
            <div class="form-group">
              <label class="label-admin" for="nome"
                >Nome completo <span style="color: red">*</span></label
              >
              <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Nome do usuário"
                required
              />
            </div>

            <div class="form-group">
              <label class="label-admin" for="email"
                >E-mail <span style="color: red">*</span></label
              >
              <input
                type="email"
                id="email"
                name="email"
                placeholder="E-mail"
                required
              />
            </div>

            <div class="form-group">
              <label class="label-admin" for="telefone"
                >Telefone <span style="color: red">*</span></label
              >
              <input
                type="text"
                id="telefone"
                name="telefone"
                placeholder="Telefone"
                required
              />
            </div>

            <div class="form-group">
              <label class="label-admin" for="cpf"
                >CPF <span style="color: red">*</span></label
              >
              <input
                type="text"
                id="cpf"
                name="cpf"
                placeholder="CPF"
                required
              />
            </div>

            <div class="form-group">
              <label class="label-admin" for="data_nascimento"
                >Data de nascimento <span style="color: red">*</span></label
              >
              <input
                type="date"
                id="data_nascimento"
                name="data_nascimento"
                required
              />
            </div>

            <div class="form-group">
              <label class="label-admin" for="genero"
                >Gênero <span style="color: red">*</span></label
              >
              <select id="genero" name="genero" required>
                <option value="" disabled selected>Selecione</option>
                <option value="Feminino">Feminino</option>
                <option value="Masculino">Masculino</option>
                <option value="Outro">Outro</option>
                <option value="Prefiro não dizer">Prefiro não dizer</option>
              </select>
            </div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn-secondary" id="cancel-btn">
              Cancelar
            </button>
            <button type="submit" class="btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </main>

    <script type="module" src="/js/main.js"></script>
    <script type="module">
      import { localStorageKeys } from "/js/hooks/useAuth.js";

      function getToken() {
        return localStorage.getItem(localStorageKeys.accessToken) || sessionStorage.getItem(localStorageKeys.accessToken);
      }

      const urlParams = new URLSearchParams(window.location.search);
      const userId = urlParams.get("id");

      if (userId) {
        fetch(`https://lume-api-xi0p.onrender.com/api/users/${userId}`, {
          headers: { "Authorization": `Bearer ${getToken()}` }
        })
          .then((res) => res.json())
          .then((user) => {
            if (user.error) {
              alert("Usuário não encontrado");
              window.location.href = "/pages/admin/users/index.html";
              return;
            }
            document.getElementById("nome").value = user.full_name || "";
            document.getElementById("email").value = user.email || "";
            document.getElementById("telefone").value = user.phone_number
              ? `(${user.phone_ddd || ""}) ${user.phone_number}`
              : "";
            document.getElementById("cpf").value = user.cpf || "";
            if (user.birth_date) {
              const dateObj = new Date(user.birth_date);
              if (!isNaN(dateObj.getTime())) {
                document.getElementById("data_nascimento").value = dateObj
                  .toISOString()
                  .split("T")[0];
              }
            }
            if (user.gender) {
              document.getElementById("genero").value = user.gender;
            }
          })
          .catch((err) => {
            console.error("Erro ao buscar usuário:", err);
            alert(
              "Erro ao buscar dados do usuário. O servidor pode estar offline.",
            );
          });
      }

      document
        .getElementById("edit-user-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          if (!userId) {
            alert("Nenhum ID de usuário fornecido para edição.");
            return;
          }

          const full_name = document.getElementById("nome").value;
          const email = document.getElementById("email").value;
          const telefoneInput = document.getElementById("telefone").value;
          const cpfInput = document.getElementById("cpf").value;
          const data_nascimento =
            document.getElementById("data_nascimento").value;
          const genero = document.getElementById("genero").value;

          const cpf = cpfInput.replace(/\D/g, "");
          const telefoneRaw = telefoneInput.replace(/\D/g, "");

          let phone_ddd = "";
          let phone_number = "";
          if (telefoneRaw.length >= 10) {
            phone_ddd = telefoneRaw.substring(0, 2);
            phone_number = telefoneRaw.substring(2);
          } else {
            phone_number = telefoneRaw;
          }

          const payload = {
            full_name: full_name,
            email: email,
            cpf: cpf,
            phone_ddd: phone_ddd,
            phone_number: phone_number,
            birth_date: data_nascimento,
            gender: genero,
          };

          const success = confirm("Deseja salvar as alterações deste usuário?");
          if (success) {
            try {
              const res = await fetch(
                `https://lume-api-xi0p.onrender.com/api/users/${userId}`,
                {
                  method: "PUT",
                  headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${getToken()}`
                  },
                  body: JSON.stringify(payload),
                },
              );

              if (res.ok) {
                alert("Usuário editado com sucesso!");
                window.location.href = "/pages/admin/users/index.html";
              } else {
                const errorData = await res.json();
                alert("Erro ao editar usuário: " + (errorData.error || ""));
              }
            } catch (error) {
              console.error(error);
              alert("Erro de conexão ao salvar usuário.");
            }
          }
        });

      document.getElementById("cancel-btn").addEventListener("click", () => {
        if (
          confirm(
            "Deseja realmente cancelar? As alterações não salvas serão perdidas.",
          )
        ) {
          window.location.href = "/pages/admin/users/index.html";
        }
      });
    </script>
  </body>
</html>
