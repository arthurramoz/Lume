<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/assets/icons/favicon.ico" />

    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/pages/users.css" />
    <link rel="stylesheet" href="/css/components/navbar.css" />
    <link rel="stylesheet" href="/css/components/button.css" />

    <title>Lume | Adicionar Usuário</title>
  </head>
  <body>
    <main class="container">
      <div class="navbar"></div>

      <div class="list">
        <a href="/pages/admin/users/index.html" class="back-link">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            viewBox="0 0 16 16"
          >
            <path
              fill-rule="evenodd"
              d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"
            />
          </svg>
          Voltar
        </a>

        <div class="create-header">
          <h1 class="section-title">Adicionar usuário</h1>
          <p class="section-subtitle">Preencha os campos abaixo</p>
        </div>

        <form id="create-user-form" class="user-form">
          <div class="user-form-grid">
            <div class="form-group">
              <label class="label-admin" for="nome"
                >Nome completo <span style="color: red">*</span></label
              >
              <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Carolina Santos"
                required
              />
            </div>

            <div class="form-group">
              <label class="label-admin" for="email"
                >E-mail <span style="color: red">*</span></label
              >
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite o e-mail"
                required
              />
            </div>

            <div class="form-group">
              <label class="label-admin" for="telefone"
                >Telefone <span style="color: red">*</span></label
              >
              <input
                type="text"
                id="telefone"
                name="telefone"
                placeholder="(11) 95643-6584"
                required
              />
            </div>

            <div class="form-group">
              <label class="label-admin" for="cpf"
                >CPF <span style="color: red">*</span></label
              >
              <input
                type="text"
                id="cpf"
                name="cpf"
                placeholder="123.456.789-10"
                required
              />
            </div>

            <div class="form-group">
              <label class="label-admin" for="data_nascimento"
                >Data de nascimento <span style="color: red">*</span></label
              >
              <input
                type="date"
                id="data_nascimento"
                name="data_nascimento"
                required
              />
            </div>

            <div class="form-group">
              <label class="label-admin" for="genero"
                >Gênero <span style="color: red">*</span></label
              >
              <select id="genero" name="genero" required>
                <option value="" disabled selected>Selecione</option>
                <option value="Feminino">Feminino</option>
                <option value="Masculino">Masculino</option>
                <option value="Outro">Outro</option>
                <option value="Prefiro não dizer">Prefiro não dizer</option>
              </select>
            </div>

            <div class="form-group">
              <label class="label-admin" for="senha"
                >Senha <span style="color: red">*</span></label
              >
              <div class="password-input-wrapper">
                <input
                  type="password"
                  id="senha"
                  name="senha"
                  placeholder="Digite sua senha"
                  required
                />
                <button
                  type="button"
                  class="password-toggle"
                  onclick="togglePassword('senha')"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    fill="currentColor"
                    viewBox="0 0 16 16"
                    style="color: var(--color-primaria100)"
                  >
                    <path
                      d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7.028 7.028 0 0 0-2.79.588l.77.771A5.944 5.944 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.134 13.134 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755-.165.165-.337.328-.517.486l.708.709z"
                    />
                    <path
                      d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829l.822.822zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829z"
                    />
                    <path
                      d="M3.35 5.47c-.18.16-.353.322-.518.487A13.134 13.134 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7.029 7.029 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12-.708.708z"
                    />
                  </svg>
                </button>
              </div>
            </div>

            <div class="form-group">
              <label class="label-admin" for="confirmar_senha"
                >Confirmar senha <span style="color: red">*</span></label
              >
              <div class="password-input-wrapper">
                <input
                  type="password"
                  id="confirmar_senha"
                  name="confirmar_senha"
                  placeholder="Confirme sua senha"
                  required
                />
                <button
                  type="button"
                  class="password-toggle"
                  onclick="togglePassword('confirmar_senha')"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    fill="currentColor"
                    viewBox="0 0 16 16"
                    style="color: var(--color-primaria100)"
                  >
                    <path
                      d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7.028 7.028 0 0 0-2.79.588l.77.771A5.944 5.944 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.134 13.134 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755-.165.165-.337.328-.517.486l.708.709z"
                    />
                    <path
                      d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829l.822.822zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829z"
                    />
                    <path
                      d="M3.35 5.47c-.18.16-.353.322-.518.487A13.134 13.134 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7.029 7.029 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12-.708.708z"
                    />
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn-secondary" id="cancel-btn">
              Cancelar
            </button>
            <button type="submit" class="btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </main>

    <script type="module" src="/js/main.js"></script>
    <script type="module">
      function togglePassword(inputId) {
        const input = document.getElementById(inputId);

        if (input.type === "password") {
          input.type = "text";
        } else {
          input.type = "password";
        }
      }

      // Expose to inline onclick handlers
      window.togglePassword = togglePassword;

      import { localStorageKeys } from "/js/hooks/useAuth.js";

      function getToken() {
        return localStorage.getItem(localStorageKeys.accessToken) || sessionStorage.getItem(localStorageKeys.accessToken);
      }

      document
        .getElementById("create-user-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const nome = document.getElementById("nome").value;
          const email = document.getElementById("email").value;
          const telefoneInput = document.getElementById("telefone").value;
          const cpfInput = document.getElementById("cpf").value;
          const data_nascimento = document.getElementById("data_nascimento").value;
          const genero = document.getElementById("genero").value;
          const senha = document.getElementById("senha").value;
          const confirmarSenha = document.getElementById("confirmar_senha").value;

          if (senha !== confirmarSenha) {
            alert("As senhas não coincidem!");
            return;
          }

          const cpf = cpfInput;
          const telefoneRaw = telefoneInput;
          
          let phone_ddd = "";
          let phone_number = "";
          if (telefoneRaw.length >= 10) {
            phone_ddd = telefoneRaw.substring(0, 2);
            phone_number = telefoneRaw.substring(2);
          } else {
            phone_number = telefoneRaw;
          }
          const phone_type = telefoneRaw.length >= 11 ? "Celular" : "Fixo";

          const payload = {
            gender: genero,
            full_name: nome,
            birth_date: data_nascimento,
            cpf: cpf,
            phone_type: phone_type,
            phone_ddd: phone_ddd,
            phone_number: phone_number,
            email: email,
            password_hash: senha
          };

          const confirmSave = confirm("Deseja salvar as informações deste usuário?");
          if (!confirmSave) return;

          try {
            const response = await fetch("https://lume-api-xi0p.onrender.com/api/users", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${getToken()}`
              },
              body: JSON.stringify(payload)
            });

            if (response.ok) {
              alert("Usuário salvo com sucesso!");
              window.location.href = "/pages/admin/users/index.html";
            } else {
              const errorData = await response.json();
              alert("Erro ao salvar usuário:\n" + (errorData.details || errorData.error));
              console.error("Erro da API:", errorData);
            }
          } catch (error) {
            console.error("Erro de conexão:", error);
            alert("Erro de conexão com o servidor. Verifique se o backend está rodando.");
          }
        });

      document.getElementById("cancel-btn").addEventListener("click", () => {
        if (
          confirm(
            "Deseja realmente cancelar? Os dados não salvos serão perdidos.",
          )
        ) {
          window.location.href = "/pages/admin/users/index.html";
        }
      });
    </script>
  </body>
</html>
