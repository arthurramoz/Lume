<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/assets/icons/favicon.ico" />

    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/pages/admin-orders.css" />
    <link rel="stylesheet" href="/css/components/navbar.css" />
    <link rel="stylesheet" href="/css/components/button.css" />
    <link rel="stylesheet" href="/css/components/inputs.css" />

    <title>Lume | Editar Pedido</title>
  </head>
  <body>
    <main class="container">
      <div class="navbar"></div>

      <div class="list">
        <div class="edit-order-wrapper">
          <a href="/pages/admin/orders/index.html" class="back-link" id="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Voltar
          </a>

          <h1 class="edit-order-title">Editar status</h1>
          <p class="edit-order-subtitle">Edite o status do pedido:</p>

          <div class="edit-order-form">
            <div class="form-group">
              <div class="select-edit-wrapper">
                <select id="order-status-select">
                  <option value="em_processamento">Em processamento</option>
                  <option value="em_transito">Em trânsito</option>
                  <option value="entregue">Entregue</option>
                  <option value="em_troca">Em troca</option>
                  <option value="solicitacao_de_troca">Solicitação de troca</option>
                  <option value="troca_autorizada">Troca autorizada</option>
                  <option value="troca_concluida">Troca concluída</option>
                </select>
                <span class="select-chevron">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </span>
              </div>
            </div>

            <div class="form-actions">
              <button class="btn-secondary" id="btn-cancelar">Cancelar</button>
              <button class="btn-primary" id="btn-salvar">Salvar</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="/js/main.js"></script>
    <script type="module">
      import { localStorageKeys } from "/js/hooks/useAuth.js";

      function getToken() {
        return (
          localStorage.getItem(localStorageKeys.accessToken) ||
          sessionStorage.getItem(localStorageKeys.accessToken)
        );
      }

      document.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get("id");
        const currentStatus = params.get("status");

        const select = document.getElementById("order-status-select");
        const btnCancelar = document.getElementById("btn-cancelar");
        const btnSalvar = document.getElementById("btn-salvar");
        const backLink = document.getElementById("back-link");

        if (currentStatus && select) {
          select.value = currentStatus;
        }

        btnCancelar.addEventListener("click", () => {
          window.location.href = "/pages/admin/orders/index.html";
        });

        backLink.addEventListener("click", (e) => {
          e.preventDefault();
          window.location.href = "/pages/admin/orders/index.html";
        });

        btnSalvar.addEventListener("click", async () => {
          const newStatus = select.value;

          if (!orderId) {
            alert("ID do pedido não encontrado.");
            return;
          }

          try {
            btnSalvar.disabled = true;
            btnSalvar.textContent = "Salvando...";

            const apiHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
              ? 'http://localhost:3333'
              : 'https://lume-api-xi0p.onrender.com';
            const res = await fetch(`${apiHost}/api/admin/orders/${orderId}/status`, {
              method: "PATCH",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${getToken()}`,
              },
              body: JSON.stringify({ status: newStatus }),
            });

            if (res.ok) {
              window.location.href = "/pages/admin/orders/index.html";
            } else {
              const errData = await res.json();
              alert("Erro ao atualizar status: " + (errData.error || errData.message || ""));
            }
          } catch (error) {
            console.error("Erro ao salvar status:", error);
            alert("Erro de conexão ao salvar status.");
          } finally {
            btnSalvar.disabled = false;
            btnSalvar.textContent = "Salvar";
          }
        });
      });
    </script>
  </body>
</html>
