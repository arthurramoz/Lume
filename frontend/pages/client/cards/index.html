<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/assets/icons/favicon.ico" />

    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/pages/client.css" />
    <link rel="stylesheet" href="/css/components/button.css" />

    <title>Lume | Meus Cartões</title>
  </head>
  <body>
    <div class="client-page">
      <header class="client-topbar"></header>

      <div class="client-content">
        <aside class="client-sidebar"></aside>

        <section class="client-main">
          <h1 class="client-main__title">Meus cartões</h1>

          <div class="client-section">
            <div id="list-cards"></div>
            <div class="client-add-btn">
              <button class="btn-primary" id="btn-add-card">
                <img src="/assets/icons/users-plus.svg" alt="+" width="16" />
                Adicionar
              </button>
            </div>
          </div>
        </section>
      </div>

      <footer class="client-footer"></footer>
    </div>

    <script type="module" src="/js/main.js"></script>
    <script type="module">
      import { localStorageKeys } from "/js/hooks/useAuth.js";
      
      function getToken() {
        return localStorage.getItem(localStorageKeys.accessToken) || sessionStorage.getItem(localStorageKeys.accessToken);
      }

      async function fetchCards() {
        try {
          const res = await fetch("https://lume-api-xi0p.onrender.com/api/cards", {
            headers: { "Authorization": `Bearer ${getToken()}` }
          });
          if (!res.ok) throw new Error("Erro ao carregar cartões");
          return await res.json();
        } catch (error) {
          console.error(error);
          return [];
        }
      }

      async function renderCards() {
        const listCards = document.getElementById("list-cards");
        const cards = await fetchCards();

        if (cards.length === 0) {
          listCards.innerHTML = `<p style="color: var(--color-neutro60); font-family: var(--font-primaria); padding: 12px; font-size: 14px;">Nenhum cartão cadastrado.</p>`;
          return;
        }

        listCards.innerHTML = cards.map(card => {
          const lastDigits = card.card_number ? card.card_number.slice(-4) : "XXXX";
          return `
          <div class="client-item" data-id="${card.id}">
            <span class="client-item__text">Final ${lastDigits}</span>
            <div class="client-item__actions">
              <button class="client-item__btn client-item__btn--delete" aria-label="Deletar" data-id="${card.id}">
                <img src="/assets/icons/users-trash.svg" alt="Deletar" />
              </button>
            </div>
          </div>
        `}).join("");
      }

      renderCards();

      document.getElementById("btn-add-card").addEventListener("click", () => {
        window.location.href = "/pages/client/cards/create/index.html";
      });

      document.querySelector(".client-main").addEventListener("click", async (e) => {
        const deleteBtn = e.target.closest('[aria-label="Deletar"]');
        if (deleteBtn) {
          const id = deleteBtn.dataset.id;
          if (confirm("Tem certeza que deseja deletar este cartão?")) {
            try {
              const res = await fetch(`https://lume-api-xi0p.onrender.com/api/cards/${id}`, {
                method: "DELETE",
                headers: { "Authorization": `Bearer ${getToken()}` }
              });
              if (res.ok) {
                alert("Cartão deletado com sucesso!");
                window.location.reload();
              } else {
                const errorData = await res.json();
                alert("Erro ao deletar cartão: " + (errorData.error || ""));
              }
            } catch (error) {
              console.error(error);
              alert("Erro de conexão ao deletar cartão.");
            }
          }
        }
      });
    </script>
  </body>
</html>
