<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="shortcut icon" href="../assets/icons/favicon.ico" />
        <link rel="stylesheet" href="../css/main.css" />
        <link rel="stylesheet" href="../css/components/footer.css" />
        <link rel="stylesheet" href="../css/components/topbar.css" />
        <link rel="stylesheet" href="../css/components/inputs.css" />
        <link rel="stylesheet" href="../css/components/button.css" />
        <link rel="stylesheet" href="../css/pages/book.css" />

        <title>Lume | Detalhes do Livro</title>
    </head>
    <body>
        <main class="product-page">
            <header class="topbar"></header>

            <div class="l-center">
                <div class="l-container">
                    <div class="breadcrumb">
                        <a href="/">Home</a> >
                        <span id="breadcrumb-title">Carregando...</span>
                    </div>

                    <section class="product-details" id="product-details">
                        <div class="product-skeleton">
                            <div class="skeleton-image"></div>
                            <div class="skeleton-info">
                                <div class="skeleton-title"></div>
                                <div class="skeleton-text"></div>
                                <div class="skeleton-text"></div>
                                <div class="skeleton-price"></div>
                            </div>
                        </div>
                    </section>
                </div>

                <footer class="footer-main">
                    <div class="footer-main__wrapper">
                        <div class="footer-main__left">
                            <p class="footer-main__text">
                                <strong>Fale conosco</strong>
                            </p>
                            <a
                                href="#"
                                class="footer-main__text footer-main__link"
                            >
                                <img
                                    src="../assets/icons/email.svg"
                                    alt=""
                                    width="24"
                                    height="24"
                                />
                                www.contato@lume.com
                            </a>
                        </div>

                        <div class="footer-main__right">
                            <img
                                src="../assets/images/logo-lume.svg"
                                alt="Lume"
                                class="footer-main__logo"
                            />
                        </div>
                    </div>
                </footer>
            </div>
        </main>

        <script type="module" src="../js/pages/book.js"></script>
    </body>
</html>
