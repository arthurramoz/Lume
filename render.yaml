databases:
  - name: lume-db
    plan: free
    databaseName: lume_db
    user: lume_user

services:
  - type: web
    name: lume-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lume-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
